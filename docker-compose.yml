services:
  markport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markport-server
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - VAULT_PATH=/app/user-data/vault
      - VAULT_REGISTRY=/app/user-data/registry.json
    volumes:
      - ./user-data/vault:/app/user-data/vault
      - ./user-data/registry.json:/app/user-data/registry.json
    networks:
      - markport-net

  nginx:
    image: nginx:alpine
    container_name: markport-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - markport
    networks:
      - markport-net

networks:
  markport-net:
    driver: bridge
