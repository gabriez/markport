services:
  # ── Generador automático de certificados SSL ─────────────────────────────────
  certgen:
    image: alpine:latest
    container_name: markport-certgen
    restart: "no"
    volumes:
      - certs_data:/certs
    command: >
      sh -c '
        if [ ! -f /certs/server.crt ]; then
          apk add --no-cache openssl > /dev/null 2>&1
          echo "Generando certificados SSL autofirmados..."
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /certs/server.key \
            -out /certs/server.crt \
            -subj "/CN=190.97.252.213" \
            -addext "subjectAltName=IP:190.97.252.213,IP:127.0.0.1"
          echo "Certificados listos."
        else
          echo "Certificados existentes detectados. Omitiendo generación."
        fi
      '

  # ── Backend Node.js de Markport (Obsidian Web) ──────────────────────────────
  markport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markport-server
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - VAULT_PATH=/app/user-data/vault
      - VAULT_REGISTRY=/app/user-data/registry.json
    volumes:
      - ${VAULT_PATH:-./user-data/vault}:/app/user-data/vault
      - ${VAULT_REGISTRY:-./user-data/registry.json}:/app/user-data/registry.json
    networks:
      - markport-net

  # ── Nginx Reverse Proxy (SSL Termination + WebSockets) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: markport-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_data:/etc/nginx/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      markport:
        condition: service_started
    networks:
      - markport-net

volumes:
  certs_data:

networks:
  markport-net:
    driver: bridge
