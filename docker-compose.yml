services:
  markport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markport-server
    restart: unless-stopped
    # No exponemos el 3000 afuera; Caddy es el único que da la cara al exterior
    expose:
      - "3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - VAULT_PATH=/app/user-data/vault
      - VAULT_REGISTRY=/app/user-data/registry.json
    volumes:
      - ${VAULT_PATH:-/app/user-data/vault}:/user-vault/vault
    networks:
      - markport-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - markport
    networks:
      - markport-net

volumes:
  caddy_data:
  caddy_config:

networks:
  markport-net:
    driver: bridge
