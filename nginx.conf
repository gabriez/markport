events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # WebSocket & HTTP Proxy
        location / {
            proxy_pass http://markport:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Buffering & Timeouts para streams y Obsidian bootstrap
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /cliproxy/ {
            # Quita el prefijo /cliproxy/ antes de mandarlo a la API
            rewrite ^/cliproxy/(.*) /$1 break;

            proxy_pass http://172.17.0.1:8317;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cabeceras CORS automáticas para que el navegador no chille
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers * always;
        }
    }

    # Redirección opcional de HTTP (80) a HTTPS (443)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
